<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage 03 // Cyber Pong Neon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Botón de eyección para regresar a tu portafolio principal -->
  <a href="https://synth-joy-station.onrender.com/" class="btn-regresar-arcade">🕹️ EXIT TO CABINET</a>

  <!-- Líneas de escaneo CRT -->
  <div class="efecto-crt-lineas"></div>

  <!-- CONTENEDOR ARCADE CENTRAL -->
  <main id="contenedor-juego">
    
    <!-- INTERFAZ DEL MENÚ INICIAL -->
    <section id="menu-inicio">
      <h1 class="titulo-neon">CYBER PONG</h1>
      <p class="subtitulo">VECTOR ARENA // LOCAL_MULTIPLAYER_KERNEL</p>

      <div class="seccion-alias">
        <label for="input-alias">PLAYER 1 PROTOCOL ALIAS:</label>
        <input type="text" id="input-alias" placeholder="PILOT_A" value="PLAYER_1" maxlength="10">
      </div>

      <div class="selector-dificultad" id="contenedor-diff">
        <label for="select-diff">AI_TACTICAL_LEVEL (ONLY FOR VS AI):</label>
        <select id="select-diff">
          <option value="easy">EASY // ROOKIE_LOGIC</option>
          <option value="medium" selected>MEDIUM // STANDARD_DRAFT</option>
          <option value="hard">HARD // PREDATOR_MODE</option>
        </select>
      </div>

      <div class="opciones-modo">
        <button class="btn-modo" onclick="inicializarModoLocal('ai')">🕹️ PLAY VS AI LOCAL</button>
        <button class="btn-modo" onclick="inicializarModoLocal('2p')">👥 LOCAL 2 PLAYERS (SAME PC)</button>
      </div>
    </section>

    <!-- ESCENARIO DE LA ARENA DE COMBATE REAL -->
    <section id="escenario-juego" class="oculto">
      <header class="cabecera-arena">
        <div id="label-p1" class="nombre-marcador">PLAYER_1</div>
        <div class="pantalla-marcador">
          <span id="score-p1" class="marcador">0</span>
          <span class="separador">:</span>
          <span id="score-p2" class="marcador">0</span>
        </div>
        <div id="label-p2" class="nombre-marcador">PLAYER_2</div>
      </header>

      <div class="controles-partida">
        <button id="btn-start-match" onclick="congelarOSaqueBola()">⚽ SERVE BALL</button>
        <button id="btn-reset-match" onclick="reiniciarMarcadoresArena()">🔄 RESET CORE</button>
        <button id="btn-main-menu" onclick="regresarAlMenuInicial_Pong()">🚪 ABORT MATCH</button>
      </div>

      <div class="cuerpo-arena">
        <canvas id="lienzo-pong" width="600" height="400"></canvas>
      </div>

      <p class="controles-ayuda" id="txt-guia-controles">P1: [W/S] MOVE // P2: [▲/▼] ARROWS MOVE</p>
    </section>

  </main>

  <p>© 2026 Cyber Pong Neon. Todos los derechos reservados. Sistema Protegido bajo Licencia MIT.</p>

  <script src="script.js"></script>
</body>
</html>
